[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-visual"
version = "0.1.0"
description = "Local visual typed judgments with Qwen3.5 and MLX"
requires-python = ">=3.11"
dependencies = ["mlx-vlm==0.7.1", "mlx==0.32.2", "fastapi", "uvicorn", "pillow", "numpy"]

[project.optional-dependencies]
test = ["pytest", "httpx"]
internvl = ["torch>=2.4", "transformers>=4.57", "accelerate", "pillow", "numpy"]

[project.scripts]
jev-visual = "jev_visual.cli:main"
jev-visual-download = "jev_visual.download:main"

[tool.setuptools.packages.find]
include = ["jev_visual*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
